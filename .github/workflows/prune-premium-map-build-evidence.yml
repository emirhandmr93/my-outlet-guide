name: Prune temporary premium map build evidence

on:
  push:
    branches:
      - feat/premium-map-exact-completion
    paths:
      - .github/workflows/prune-premium-map-build-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Remove raw capture payloads and temporary CI workflows
        run: |
          rm -rf docs/premium-map-network-discovery
          rm -rf docs/premium-map-pdf-evidence
          rm -f docs/PREMIUM_MAP_NETWORK_DISCOVERY.json
          rm -f docs/PREMIUM_MAP_SPATIAL_ANALYSIS.json
          rm -f docs/PREMIUM_MAP_MAPPEDIN_IMPORT_AUDIT.json
          rm -f docs/PREMIUM_MAP_MAPPEDIN_IMPORT_UNRESOLVED.json
          rm -f docs/PREMIUM_MAP_PDF_IMPORT_AUDIT.json
          rm -f .github/workflows/audit-authorized-mappedin-premium-map-import.yml
          rm -f .github/workflows/audit-authorized-pdf-premium-map-import.yml
          rm -f .github/workflows/build-authorized-premium-map-evidence.yml
          rm -f .github/workflows/generate-authorized-mappedin-exact-maps.yml
          rm -f .github/workflows/generate-authorized-pdf-exact-maps.yml
          rm -f .github/workflows/validate-premium-map-campaign-finish.yml
          rm -f .github/workflows/prune-premium-map-build-evidence.yml

      - name: Commit compact production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to prune."
            exit 0
          fi
          git commit -m "Prune temporary premium map evidence payloads"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
