name: One-time Shanghai Tang dedupe

on:
  push:
    branches:
      - fix/remove-duplicate-shanghai-tang
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-duplicate:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'fix/remove-duplicate-shanghai-tang')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          sparse-checkout: |
            src/constants/brands/brands-q-t.ts
          sparse-checkout-cone-mode: false

      - name: Remove duplicate canonical Shanghai Tang record
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/constants/brands/brands-q-t.ts';
          const text = fs.readFileSync(path, 'utf8');
          const eol = text.includes('\r\n') ? '\r\n' : '\n';
          const lines = text.split(/\r?\n/);
          const matches = lines
            .map((line, index) => ({ line, index }))
            .filter(({ line }) =>
              line.includes('"brandId":"shanghai-tang"') &&
              line.includes('"rankingWeight":60') &&
              line.includes('"luxuryLevel":"fashion"')
            );
          if (matches.length !== 1) {
            throw new Error(`Expected exactly one low-detail duplicate Shanghai Tang record, found ${matches.length}.`);
          }
          lines.splice(matches[0].index, 1);
          fs.writeFileSync(path, lines.join(eol), 'utf8');
          NODE

      - name: Verify retained canonical record
        shell: bash
        run: |
          grep -n 'brandId: "shanghai-tang"' src/constants/brands/brands-q-t.ts
          test "$(grep -c 'brandId: "shanghai-tang"' src/constants/brands/brands-q-t.ts)" -eq 1
          grep -A 8 'brandId: "shanghai-tang"' src/constants/brands/brands-q-t.ts | grep 'originCountryId: "hong-kong"'
          git diff --check

      - name: Commit source fix
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git add src/constants/brands/brands-q-t.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix duplicate Shanghai Tang brand identity"
          git push origin HEAD:"$BRANCH"
