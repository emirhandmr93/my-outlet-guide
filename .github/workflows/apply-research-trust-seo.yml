name: Apply research trust SEO

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/research-index-and-methodology'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply research and trust route wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(file) { return fs.readFileSync(file, 'utf8'); }
          function write(file, value) { fs.writeFileSync(file, value); }
          function replaceOnce(file, from, to, marker) {
            let text = read(file);
            if (text.includes(marker)) return;
            if (!text.includes(from)) throw new Error(`${file}: patch source not found for ${marker}`);
            text = text.replace(from, to);
            write(file, text);
          }

          // Break a potential research-copy/webSeo import cycle while keeping publication exclusions explicit.
          {
            const file = 'src/constants/europeanOutletResearch.ts';
            let text = read(file);
            if (text.includes('import { isWebSeoPublicOutlet } from "./webSeo";')) {
              text = text.replace('import { isWebSeoPublicOutlet } from "./webSeo";\n', '');
            }
            if (!text.includes('EUROPEAN_RESEARCH_UNPUBLISHED_OUTLET_IDS')) {
              text = text.replace(
                'export const EUROPEAN_OUTLET_INDEX_EDITION = "2026";\n',
                `export const EUROPEAN_OUTLET_INDEX_EDITION = "2026";\n\nexport const EUROPEAN_RESEARCH_UNPUBLISHED_OUTLET_IDS = [\n  "viaport-asia-outlet-shopping",\n  "212-outlet",\n  "olivium-outlet-center",\n  "starcity-outlet",\n  "venezia-mega-outlet",\n  "optimum-premium-outlet-istanbul",\n  "izmir-optimum",\n  "deepo-outlet-center",\n] as const;\nconst researchUnpublishedOutletIds = new Set<string>(EUROPEAN_RESEARCH_UNPUBLISHED_OUTLET_IDS);\nfunction isResearchPublicOutlet(outlet: (typeof outlets)[number]) {\n  return outlet.status === "active" && typeof outlet.outletId === "string" && !researchUnpublishedOutletIds.has(outlet.outletId);\n}\n`,
              );
            }
            text = text.replace('const publicOutlets = outlets.filter(isWebSeoPublicOutlet);', 'const publicOutlets = outlets.filter(isResearchPublicOutlet);');
            write(file, text);
          }

          replaceOnce(
            'src/navigation/types.ts',
            '  HelpFaq: undefined;\n  DeleteAccount: undefined;',
            '  HelpFaq: undefined;\n  OutletShoppingIndex: undefined;\n  EditorialMethodology: undefined;\n  DeleteAccount: undefined;',
            'OutletShoppingIndex: undefined;',
          );

          replaceOnce(
            'src/navigation/webLinking.ts',
            '{ name: "Login", path: "login" }, { name: "MyReviews", path: "reviews" }, { name: "ReviewModeration", path: "review-moderation" }, { name: "PrivacyPolicy", path: "privacy" }, { name: "TermsConditions", path: "terms" }, { name: "ContactUs", path: "contact" }, { name: "HelpFaq", path: "help" }, { name: "DeleteAccount", path: "delete-account" }, { name: "MediaCredits", path: "media-credits" },',
            '{ name: "Login", path: "login" }, { name: "MyReviews", path: "reviews" }, { name: "ReviewModeration", path: "review-moderation" }, { name: "PrivacyPolicy", path: "privacy" }, { name: "TermsConditions", path: "terms" }, { name: "ContactUs", path: "contact" }, { name: "HelpFaq", path: "help" }, { name: "OutletShoppingIndex", path: "research/european-outlet-shopping-index" }, { name: "EditorialMethodology", path: "methodology" }, { name: "DeleteAccount", path: "delete-account" }, { name: "MediaCredits", path: "media-credits" },',
            'name: "OutletShoppingIndex"',
          );

          replaceOnce(
            'src/navigation/AppNavigator.tsx',
            'import { HelpFaqScreen } from "../screens/HelpFaqScreen";\nimport { HomeScreen } from "../screens/HomeScreen";',
            'import { HelpFaqScreen } from "../screens/HelpFaqScreen";\nimport { OutletShoppingIndexScreen } from "../screens/OutletShoppingIndexScreen";\nimport { EditorialMethodologyScreen } from "../screens/EditorialMethodologyScreen";\nimport { HomeScreen } from "../screens/HomeScreen";',
            'OutletShoppingIndexScreen',
          );
          replaceOnce(
            'src/navigation/AppNavigator.tsx',
            '<Stack.Screen name="HelpFaq" component={HelpFaqScreen} options={{ title: t("nav.helpFaq") }} />\n<Stack.Screen name="DeleteAccount" component={DeleteAccountScreen} options={{ title: t("nav.deleteAccount") }} />',
            '<Stack.Screen name="HelpFaq" component={HelpFaqScreen} options={{ title: t("nav.helpFaq") }} />\n<Stack.Screen name="OutletShoppingIndex" component={OutletShoppingIndexScreen} options={{ title: "My Outlet Guide" }} />\n<Stack.Screen name="EditorialMethodology" component={EditorialMethodologyScreen} options={{ title: "My Outlet Guide" }} />\n<Stack.Screen name="DeleteAccount" component={DeleteAccountScreen} options={{ title: t("nav.deleteAccount") }} />',
            'name="EditorialMethodology"',
          );

          {
            const file = 'src/constants/webSeo.ts';
            let text = read(file);
            if (!text.includes('EUROPEAN_OUTLET_RESEARCH_COPY')) {
              text = text.replace(
                'import { WEB_ROUTE_DEFINITIONS } from "../navigation/webLinking";\n',
                'import { WEB_ROUTE_DEFINITIONS } from "../navigation/webLinking";\nimport { EUROPEAN_OUTLET_RESEARCH_COPY } from "./europeanOutletResearch";\n',
              );
            }
            text = text.replace(
              'export type WebSeoRouteKind = "home" | "explore" | "savings" | "smart" | "price" | "tax" | "outlet" | "brand" | "country" | "city" | "transportation" | "privacy" | "terms" | "contact" | "help";',
              'export type WebSeoRouteKind = "home" | "explore" | "savings" | "smart" | "price" | "tax" | "outlet" | "brand" | "country" | "city" | "transportation" | "research" | "methodology" | "privacy" | "terms" | "contact" | "help";',
            );
            if (!text.includes('{kind:"research",path:"research/european-outlet-shopping-index"}')) {
              text = text.replace(
                '{kind:"home",path:""},{kind:"explore",path:"explore"},{kind:"savings",path:"savings"},{kind:"smart",path:"calculator/smart-shopping"},{kind:"price",path:"calculator/price-advantage"},{kind:"tax",path:"calculator/tax-free"},{kind:"privacy",path:"privacy"},{kind:"terms",path:"terms"},{kind:"contact",path:"contact"},{kind:"help",path:"help"},',
                '{kind:"home",path:""},{kind:"explore",path:"explore"},{kind:"savings",path:"savings"},{kind:"smart",path:"calculator/smart-shopping"},{kind:"price",path:"calculator/price-advantage"},{kind:"tax",path:"calculator/tax-free"},{kind:"privacy",path:"privacy"},{kind:"terms",path:"terms"},{kind:"contact",path:"contact"},{kind:"help",path:"help"},{kind:"research",path:"research/european-outlet-shopping-index"},{kind:"methodology",path:"methodology"},',
              );
            }
            text = text.replace(
              '["Home","Explore","Savings","SmartShoppingCalculator","PriceAdvantageCalculator","TaxFreeCalculator","OutletDetail","BrandResults","Country","CityResults","Transportation","PrivacyPolicy","TermsConditions","ContactUs","HelpFaq"]',
              '["Home","Explore","Savings","SmartShoppingCalculator","PriceAdvantageCalculator","TaxFreeCalculator","OutletDetail","BrandResults","Country","CityResults","Transportation","PrivacyPolicy","TermsConditions","ContactUs","HelpFaq","OutletShoppingIndex","EditorialMethodology"]',
            );
            if (!text.includes('research/european-outlet-shopping-index", "discovery"')) {
              const homeBlock = `  if (page.kind === "home") {\n    add(resolveTranslation(language, "nav.explore"), "explore");\n    for (const [key,path] of [["nav.savings","savings"],["nav.helpFaq","help"],["nav.contactUs","contact"],["nav.privacyPolicy","privacy"],["nav.termsConditions","terms"]] as const)\n      add(resolveTranslation(language,key),path);\n  }`;
              const homeReplacement = `${homeBlock.slice(0, -1)}    add(EUROPEAN_OUTLET_RESEARCH_COPY[language].indexTitle, "research/european-outlet-shopping-index", "discovery");\n    add(EUROPEAN_OUTLET_RESEARCH_COPY[language].methodologyTitle, "methodology", "discovery");\n  }`;
              if (!text.includes(homeBlock)) throw new Error('src/constants/webSeo.ts: home block not found');
              text = text.replace(homeBlock, homeReplacement);
            }
            if (!text.includes('page.kind === "research"')) {
              const needle = '  if (!links.length) add(resolveTranslation(language, "nav.home"), "");';
              const extra = `  if (page.kind === "research") {\n    add(resolveTranslation(language, "nav.explore"), "explore");\n    add(EUROPEAN_OUTLET_RESEARCH_COPY[language].taxFreeCta, "calculator/tax-free");\n    add(EUROPEAN_OUTLET_RESEARCH_COPY[language].methodologyCta, "methodology");\n  }\n  if (page.kind === "methodology") {\n    add(EUROPEAN_OUTLET_RESEARCH_COPY[language].indexTitle, "research/european-outlet-shopping-index");\n    add(resolveTranslation(language, "nav.contactUs"), "contact");\n  }\n${needle}`;
              if (!text.includes(needle)) throw new Error('src/constants/webSeo.ts: link fallback not found');
              text = text.replace(needle, extra);
            }
            const oldResolve = 'export function resolveWebSeo(language: TranslationLanguage, page?: WebSeoLogicalPage): WebSeoMetadata {\n  const logical = page; const copy = WEB_SEO_COPY[language]; const values = logical ? copy[logical.kind] : copy.shell;';
            if (text.includes(oldResolve)) {
              const newResolve = `export function resolveWebSeo(language: TranslationLanguage, page?: WebSeoLogicalPage): WebSeoMetadata {\n  const logical = page; const copy = WEB_SEO_COPY[language]; const researchCopy = EUROPEAN_OUTLET_RESEARCH_COPY[language];\n  let values: [string, string];\n  if (!logical) values = copy.shell;\n  else if (logical.kind === "research") values = [\`${'${researchCopy.indexTitle}'} | My Outlet Guide\`, researchCopy.indexIntro];\n  else if (logical.kind === "methodology") values = [\`${'${researchCopy.methodologyTitle}'} | My Outlet Guide\`, researchCopy.methodologySubtitle];\n  else values = copy[logical.kind];`;
              text = text.replace(oldResolve, newResolve);
            }
            write(file, text);
          }

          {
            const file = 'tools/checkWebSeo.ts';
            let text = read(file);
            text = text.replace(
              '{file:"sitemap-core.xml",kinds:["home","explore","savings","smart","price","tax","privacy","terms","contact","help"]}',
              '{file:"sitemap-core.xml",kinds:["home","explore","savings","smart","price","tax","privacy","terms","contact","help","research","methodology"]}',
            );
            text = text.replace(
              '["home","explore","savings","smart","price","tax","privacy","terms","contact","help","outlet","brand","country","city","transportation"]',
              '["home","explore","savings","smart","price","tax","privacy","terms","contact","help","research","methodology","outlet","brand","country","city","transportation"]',
            );
            write(file, text);
          }

          {
            const file = 'tools/checkResearchTrustSeo.ts';
            let text = read(file);
            if (!text.includes('EUROPEAN_RESEARCH_UNPUBLISHED_OUTLET_IDS')) {
              text = text.replace(
                'import { getEuropeanOutletCountryMetrics } from "../src/constants/europeanOutletResearch";',
                'import { EUROPEAN_RESEARCH_UNPUBLISHED_OUTLET_IDS, getEuropeanOutletCountryMetrics } from "../src/constants/europeanOutletResearch";',
              );
              text = text.replace(
                'import { WEB_SEO_LANGUAGES, WEB_SEO_ORIGIN } from "../src/constants/webSeo";',
                'import { WEB_SEO_LANGUAGES, WEB_SEO_ORIGIN, WEB_SEO_UNPUBLISHED_OUTLET_IDS } from "../src/constants/webSeo";',
              );
              text = text.replace(
                'async function main() {\n  for (const language of WEB_SEO_LANGUAGES) {',
                'async function main() {\n  assert(EUROPEAN_RESEARCH_UNPUBLISHED_OUTLET_IDS.length === WEB_SEO_UNPUBLISHED_OUTLET_IDS.length && EUROPEAN_RESEARCH_UNPUBLISHED_OUTLET_IDS.every((id) => WEB_SEO_UNPUBLISHED_OUTLET_IDS.includes(id)), "Research publication exclusions differ from central web SEO policy");\n  for (const language of WEB_SEO_LANGUAGES) {',
              );
            }
            write(file, text);
          }

          {
            const file = 'package.json';
            let text = read(file);
            text = text.replace(
              'tsx tools/enhancePriorityEditorialSeo.ts && tsx tools/checkWebSeo.ts',
              'tsx tools/enhancePriorityEditorialSeo.ts && tsx tools/enhanceResearchTrustSeo.ts && tsx tools/checkWebSeo.ts',
            );
            text = text.replace(
              'tsx tools/checkPriorityEditorialSeo.ts && tsx tools/checkInternalLinksFast.ts',
              'tsx tools/checkPriorityEditorialSeo.ts && tsx tools/checkResearchTrustSeo.ts && tsx tools/checkInternalLinksFast.ts',
            );
            text = text.replace(
              'tsx tools/checkDestinationAnchorIntentSeo.ts && tsx tools/checkPriorityEditorialSeo.ts",',
              'tsx tools/checkDestinationAnchorIntentSeo.ts && tsx tools/checkPriorityEditorialSeo.ts && tsx tools/checkResearchTrustSeo.ts",',
            );
            write(file, text);
          }
          NODE

      - name: Build and validate full web SEO
        run: npm run web:build

      - name: Commit applied wiring
        run: |
          if git diff --quiet; then
            echo "Research/trust SEO wiring already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/constants/europeanOutletResearch.ts src/constants/webSeo.ts src/navigation/types.ts src/navigation/webLinking.ts src/navigation/AppNavigator.tsx tools/checkWebSeo.ts tools/checkResearchTrustSeo.ts package.json
          git commit -m "Wire research index and editorial methodology"
          git push origin HEAD:${{ github.head_ref }}
