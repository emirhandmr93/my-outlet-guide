name: Final SEO audit 2026-08-19

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-web:
    if: github.head_ref == 'chore/final-seo-audit-20260819'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run final web SEO build and validation
        run: npm run web:build
