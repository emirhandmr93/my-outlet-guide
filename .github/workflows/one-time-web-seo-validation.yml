name: One-time web SEO validation

on:
  push:
    branches:
      - chore/one-time-web-seo-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-web:
    if: github.event_name != 'pull_request' || github.head_ref == 'chore/one-time-web-seo-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate web SEO
        run: npm run web:build
