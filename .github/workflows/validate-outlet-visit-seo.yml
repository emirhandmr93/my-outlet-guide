name: Validate outlet visit SEO

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-web:
    if: github.head_ref == 'feat/seo-outlet-visit-intent'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate web SEO
        run: npm run web:build
