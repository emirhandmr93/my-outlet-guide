name: Sync final expansion MasterData

on:
  push:
    branches:
      - codex/complete-us-asia-data
    paths-ignore:
      - "MasterData/**"

permissions:
  contents: write

jobs:
  sync-master-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: codex/complete-us-asia-data
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize MasterData
        run: npm run data:sync

      - name: Verify synchronized MasterData
        run: npm run data:check

      - name: Validate outlet expansion
        run: npm run validate:outlet-expansion

      - name: Validate transportation V2
        run: node --import tsx tools/checkTransportationV2.ts

      - name: Validate master data references
        run: npm run validate:master-data

      - name: Commit synchronized MasterData
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MasterData
          if git diff --cached --quiet; then
            echo "MasterData already synchronized."
          else
            git commit -m "data: synchronize final expansion MasterData"
            git push origin HEAD:codex/complete-us-asia-data
          fi

      - name: Upload synchronized MasterData
        uses: actions/upload-artifact@v4
        with:
          name: final-expansion-masterdata
          path: MasterData
          if-no-files-found: error
          retention-days: 1
