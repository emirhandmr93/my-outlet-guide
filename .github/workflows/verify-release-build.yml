name: Verify release build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=6144"

permissions:
  contents: read

jobs:
  verify-release-build:
    name: Verify release build on Node 22
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies cleanly
        run: npm ci

      - name: Install Functions dependencies cleanly
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Validate release inputs
        run: npm run validate:release

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Prepare web translations
        run: npm run translations:web:prepare

      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist

      - name: Finalize web SEO
        run: npx tsx tools/finalizeWebSeo.ts

      - name: Enhance priority country SEO
        run: npx tsx tools/enhancePriorityCountrySeo.ts

      - name: Enhance priority city SEO
        run: npx tsx tools/enhancePriorityCitySeo.ts

      - name: Enhance UK and Spain SEO
        run: npx tsx tools/enhanceUkSpainSeo.ts

      - name: Enhance Germany and Netherlands SEO
        run: npx tsx tools/enhanceGermanyNetherlandsSeo.ts

      - name: Enhance flagship outlet SEO
        run: npx tsx tools/enhanceFlagshipOutletSeo.ts

      - name: Enhance flagship outlet SEO batch 2
        run: npx tsx tools/enhanceFlagshipOutletSeoBatch2.ts

      - name: Enhance broad entity SEO
        run: npx tsx tools/enhanceBroadEntitySeo.ts

      - name: Enhance tax free SEO
        run: npx tsx tools/enhanceTaxFreeSeo.ts

      - name: Enhance brand SEO
        run: npx tsx tools/enhanceBrandSeo.ts

      - name: Enhance brand country intent SEO
        run: npx tsx tools/enhanceBrandCountryIntentSeo.ts

      - name: Enhance search intent SEO
        run: npx tsx tools/enhanceSearchIntentSeo.ts

      - name: Enhance entity intent SEO
        run: npx tsx tools/enhanceEntityIntentSeo.ts

      - name: Enhance country tax free SEO
        run: npx tsx tools/enhanceCountryTaxFreeSeo.ts

      - name: Enhance outlet brand intent SEO
        run: npx tsx tools/enhanceOutletBrandIntentSeo.ts

      - name: Enhance destination anchor intent SEO
        run: npx tsx tools/enhanceDestinationAnchorIntentSeo.ts

      - name: Enhance priority editorial SEO
        run: npx tsx tools/enhancePriorityEditorialSeo.ts

      - name: Enhance research trust SEO
        run: npx tsx tools/enhanceResearchTrustSeo.ts

      - name: Re-run entity intent SEO
        run: npx tsx tools/enhanceEntityIntentSeo.ts

      - name: Re-run country tax free SEO
        run: npx tsx tools/enhanceCountryTaxFreeSeo.ts

      - name: Validate web SEO
        run: npx tsx tools/checkWebSeo.ts

      - name: Validate SEO enhancement coverage
        run: npx tsx tools/checkSeoEnhancementCoverage.ts

      - name: Validate entity intent SEO
        run: npx tsx tools/checkEntityIntentSeo.ts

      - name: Validate brand country intent SEO
        run: npx tsx tools/checkBrandCountryIntentSeo.ts

      - name: Validate country tax free SEO
        run: npx tsx tools/checkCountryTaxFreeSeo.ts

      - name: Validate outlet brand intent SEO
        run: npx tsx tools/checkOutletBrandIntentSeo.ts

      - name: Validate destination anchor intent SEO
        run: npx tsx tools/checkDestinationAnchorIntentSeo.ts

      - name: Validate priority editorial SEO
        run: npx tsx tools/checkPriorityEditorialSeo.ts

      - name: Validate research trust SEO
        run: npx tsx tools/checkResearchTrustSeo.ts

      - name: Validate internal links
        run: npx tsx tools/checkInternalLinksFast.ts

      - name: Report web performance
        run: npx tsx tools/reportWebPerformance.ts

      - name: Diagnose web initial raw JS budget
        continue-on-error: true
        run: npx tsx tools/checkWebPerformanceBudget.ts dist raw

      - name: Diagnose web initial gzip JS budget
        continue-on-error: true
        run: npx tsx tools/checkWebPerformanceBudget.ts dist gzip

      - name: Diagnose web exported assets budget
        continue-on-error: true
        run: npx tsx tools/checkWebPerformanceBudget.ts dist assets

      - name: Validate complete web performance budget
        run: npx tsx tools/checkWebPerformanceBudget.ts dist all

      - name: Report export sizes
        run: du -sh dist-android dist-ios dist

      - name: Remove generated exports
        run: rm -rf dist-android dist-ios dist

      - name: Confirm Functions build output is untracked
        run: |
          tracked_files="$(git ls-files functions/lib)"
          if [ -n "$tracked_files" ]; then
            echo "functions/lib must not be tracked:"
            echo "$tracked_files"
            exit 1
          fi
          echo "functions/lib is not tracked."

      - name: Check patch whitespace
        run: git diff --check

      - name: Confirm working tree has no uncommitted generated files
        run: |
          status="$(git status --short)"
          if [ -n "$status" ]; then
            echo "Working tree has uncommitted changes:"
            echo "$status"
            exit 1
          fi
          echo "Working tree is clean."
