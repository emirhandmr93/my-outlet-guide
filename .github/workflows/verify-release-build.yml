name: Verify release build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=6144"

permissions:
  contents: read

jobs:
  verify-release-build:
    name: Verify release build on Node 22
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies cleanly
        run: npm ci

      - name: Install Functions dependencies cleanly
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Validate release inputs
        run: npm run validate:release

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Build and validate web export
        run: npm run web:build

      - name: Report export sizes
        run: du -sh dist-android dist-ios dist

      - name: Remove generated exports
        run: rm -rf dist-android dist-ios dist

      - name: Confirm Functions build output is untracked
        run: |
          tracked_files="$(git ls-files functions/lib)"
          if [ -n "$tracked_files" ]; then
            echo "functions/lib must not be tracked:"
            echo "$tracked_files"
            exit 1
          fi
          echo "functions/lib is not tracked."

      - name: Check patch whitespace
        run: git diff --check

      - name: Confirm working tree has no uncommitted generated files
        run: |
          status="$(git status --short)"
          if [ -n "$status" ]; then
            echo "Working tree has uncommitted changes:"
            echo "$status"
            exit 1
          fi
          echo "Working tree is clean."
