name: Audit authorized Mappedin premium map import

on:
  push:
    branches:
      - feat/premium-map-exact-completion
    paths:
      - tools/auditAuthorizedMappedinPremiumMapImport.ts
      - docs/premium-map-network-discovery/**
      - .github/workflows/audit-authorized-mappedin-premium-map-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mappedin-premium-map-import-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit canonical tenant-to-space mapping
        run: npx tsx tools/auditAuthorizedMappedinPremiumMapImport.ts

      - name: Validate audit shape
        run: |
          test -f docs/PREMIUM_MAP_MAPPEDIN_IMPORT_AUDIT.json
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('docs/PREMIUM_MAP_MAPPEDIN_IMPORT_AUDIT.json', 'utf8'));
          if (audit.summary.outletCount !== 8) throw new Error(`Expected 8 Mappedin outlets, got ${audit.summary.outletCount}`);
          if (!Number.isFinite(audit.summary.canonicalBrandCount) || !Number.isFinite(audit.summary.resolvedBrandCount)) throw new Error('Invalid audit counts');
          NODE

      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PREMIUM_MAP_MAPPEDIN_IMPORT_AUDIT.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "Audit exact Mappedin premium map import"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
