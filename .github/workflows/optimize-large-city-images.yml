name: Optimize large city images

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize-and-validate:
    if: github.head_ref == 'perf/optimize-large-city-images'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false sharp@0.35.3

      - name: Optimize oversized city WebP assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sharp = require('sharp');

          const targets = [
            { path: 'assets/city-images/London.webp', maxBytes: 1500000 },
            { path: 'assets/city-images/Paris.webp', maxBytes: 1000000 },
            { path: 'assets/city-images/Munich.webp', maxBytes: 1000000 },
          ];

          (async () => {
            for (const target of targets) {
              const before = fs.statSync(target.path).size;
              if (before <= target.maxBytes) {
                console.log(`${target.path}: already within budget (${before} bytes)`);
                continue;
              }

              const temporary = `${target.path}.optimized.webp`;
              const metadata = await sharp(target.path).metadata();
              await sharp(target.path)
                .autoOrient()
                .resize({ width: 1800, withoutEnlargement: true })
                .webp({ quality: 82, effort: 6, smartSubsample: true })
                .toFile(temporary);

              const after = fs.statSync(temporary).size;
              if (after >= before) {
                fs.unlinkSync(temporary);
                throw new Error(`${target.path}: optimization did not reduce size (${before} -> ${after})`);
              }
              if (after > target.maxBytes) {
                fs.unlinkSync(temporary);
                throw new Error(`${target.path}: optimized size ${after} still exceeds ${target.maxBytes}`);
              }

              fs.renameSync(temporary, target.path);
              console.log(`${target.path}: ${before} -> ${after} bytes; source ${metadata.width}x${metadata.height}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build and validate web
        run: npm run web:build

      - name: Commit optimized assets when changed
        run: |
          if git diff --quiet -- assets/city-images/London.webp assets/city-images/Paris.webp assets/city-images/Munich.webp; then
            echo "City images already optimized; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/city-images/London.webp assets/city-images/Paris.webp assets/city-images/Munich.webp
          git commit -m "Optimize large city images"
          git push origin HEAD:${{ github.head_ref }}
