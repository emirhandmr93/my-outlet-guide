name: Finalize pushed outlet media

on:
  push:
    branches:
      - automation/finalize-final32-media
    paths:
      - "tools/finalizePushedMedia.mjs"
      - "tools/patchFinalizePushedMedia.mjs"
      - ".github/workflows/finalize-pushed-media.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/finalize-final32-media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Import pushed media directories
        run: |
          git fetch origin manual/final-32-media-upload --depth=1
          for id in \
            woodbury-common-premium-outlets \
            sawgrass-mills \
            orlando-vineland-premium-outlets \
            las-vegas-north-premium-outlets \
            desert-hills-premium-outlets \
            san-francisco-premium-outlets \
            sano-premium-outlets \
            one-salonica-outlet-mall \
            m3-outlet-polgar \
            mitsui-outlet-park-tainan \
            changi-city-point \
            orlando-international-premium-outlets \
            the-mills-at-jersey-gardens \
            chicago-premium-outlets \
            seattle-premium-outlets \
            wrentham-village-premium-outlets \
            san-marcos-premium-outlets \
            waikele-premium-outlets \
            las-vegas-south-premium-outlets \
            las-americas-premium-outlets \
            factory-krakow \
            mega-outlet-thessaloniki \
            barari-outlet-mall
          do
            git checkout FETCH_HEAD -- "assets/outlet-images/$id"
          done
          git checkout FETCH_HEAD -- assets/outlet-images/central-village-outlet
          rm -rf assets/outlet-images/central-village-bangkok
          mv assets/outlet-images/central-village-outlet assets/outlet-images/central-village-bangkok
      - name: Patch finalizer matcher
        run: node tools/patchFinalizePushedMedia.mjs
      - run: node tools/finalizePushedMedia.mjs
      - run: npm ci
      - run: npm run data:sync
      - run: npm run data:check
      - run: npm run validate:outlet-expansion
      - run: node --import tsx tools/checkTransportationV2.ts
      - run: npm run validate:master-data
      - run: node --import tsx tools/checkFinal32OutletReadiness.ts
      - run: node --import tsx tools/reportFinal32Media.ts
      - run: npm run validate:media
      - run: npm run typecheck
      - name: Commit finalized media and data scope
        run: |
          rm -f tools/finalizePushedMedia.mjs tools/patchFinalizePushedMedia.mjs .github/workflows/finalize-pushed-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "media: finalize final 32 outlet visuals and approved US scope"
          git push origin HEAD:automation/finalize-final32-media
