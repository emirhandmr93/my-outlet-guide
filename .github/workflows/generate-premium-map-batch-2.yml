name: Generate premium map batch 2

on:
  push:
    branches:
      - feat/premium-map-batch-2
    paths:
      - tools/generatePremiumMapBatch2ExactMaps.ts
      - tools/checkPremiumMapBatch2.ts
      - tools/capturePremiumMapNetworkBatch2.mjs
      - src/features/premiumOutletMaps/batch2SourceManifest.ts
      - src/features/premiumOutletMaps/types.ts
      - .github/workflows/generate-premium-map-batch-2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-premium-map-batch-2-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  EXPO_NO_TELEMETRY: "1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-map-batch-2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install isolated evidence-capture runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/premium-map-capture-runtime"
          mkdir -p "$runtime"
          npm install --prefix "$runtime" --no-save --package-lock=false playwright-core@1.55.0 fflate@0.8.2
          rm -rf node_modules/playwright-core node_modules/fflate
          ln -s "$runtime/node_modules/playwright-core" node_modules/playwright-core
          ln -s "$runtime/node_modules/fflate" node_modules/fflate

      - name: Capture official interactive-map spatial evidence
        run: node tools/capturePremiumMapNetworkBatch2.mjs

      - name: Generate exact production maps
        run: npx tsx tools/generatePremiumMapBatch2ExactMaps.ts

      - name: Validate exact geometry, canonical identity and commercial authorization
        run: npx tsx tools/checkPremiumMapBatch2.ts

      - name: Typecheck generated snapshot
        run: npm run typecheck

      - name: Validate generation report
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('docs/PREMIUM_MAP_MAPPEDIN_BATCH2_REPORT.json', 'utf8'));
          if (report.summary.exactMapCount !== 10) throw new Error(`Expected 10 exact maps, got ${report.summary.exactMapCount}`);
          const overall = report.summary.mappedCanonicalBrandCount / Math.max(1, report.summary.canonicalBrandCount);
          if (overall < 0.9) throw new Error(`Overall batch-2 coverage ${(overall * 100).toFixed(1)}% is below 90%`);
          for (const result of report.results) {
            if (result.canonicalCoverage < 0.75) throw new Error(`${result.outletId}: coverage ${(result.canonicalCoverage * 100).toFixed(1)}%`);
            if (result.authorizationStatus !== 'project-owner-confirmed') throw new Error(`${result.outletId}: authorization state is not production-ready`);
            if (result.authorizationConfirmedOn !== '2026-09-04') throw new Error(`${result.outletId}: authorization date mismatch`);
          }
          console.log(JSON.stringify(report.summary, null, 2));
          NODE

      - name: Remove raw capture evidence before commit
        run: rm -rf docs/premium-map-batch-2-evidence

      - name: Commit generated exact-map snapshot and compact reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/features/premiumOutletMaps/generatedMappedinExactMapsBatch2.ts \
            docs/PREMIUM_MAP_MAPPEDIN_BATCH2_REPORT.json \
            docs/PREMIUM_MAP_BATCH2_NETWORK.json
          if git diff --cached --quiet; then
            echo "Generated snapshot already up to date."
            exit 0
          fi
          git commit -m "Generate licensed exact premium map batch 2"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
