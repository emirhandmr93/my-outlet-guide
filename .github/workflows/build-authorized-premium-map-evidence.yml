name: Build authorized premium map evidence

on:
  push:
    branches:
      - feat/premium-map-exact-completion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authorized-premium-map-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install isolated capture helpers
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0 fflate@0.8.2

      - name: Capture authorized official spatial responses
        run: node tools/captureAuthorizedPremiumMapNetwork.mjs

      - name: Extract authorized official vector plans
        run: |
          python -m pip install --disable-pip-version-check --quiet pymupdf==1.26.4
          python tools/extractAuthorizedPdfMapEvidence.py

      - name: Analyze captured spatial data
        run: node tools/analyzeAuthorizedPremiumMapData.mjs

      - name: Validate evidence completeness
        run: |
          test -f docs/PREMIUM_MAP_NETWORK_DISCOVERY.json
          test -f docs/PREMIUM_MAP_SPATIAL_ANALYSIS.json
          test -f docs/premium-map-pdf-evidence/outletcity-metzingen.json
          test -f docs/premium-map-pdf-evidence/the-mall-firenze.json
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const networkIds = [
            'bicester-village','la-vallee-village','la-roca-village','las-rozas-village','fidenza-village',
            'serravalle-designer-outlet','designer-outlet-roermond','noventa'
          ];
          for (const id of networkIds) {
            const dir = path.join('docs','premium-map-network-discovery',id);
            if (!fs.existsSync(dir)) throw new Error(`Missing network evidence directory: ${id}`);
            const jsonFiles = [];
            const walk = d => { for (const e of fs.readdirSync(d,{withFileTypes:true})) { const p=path.join(d,e.name); if(e.isDirectory()) walk(p); else if(e.isFile()&&e.name.endsWith('.json')) jsonFiles.push(p); } };
            walk(dir);
            if (!jsonFiles.length) throw new Error(`No captured spatial JSON evidence: ${id}`);
          }
          const analysis = JSON.parse(fs.readFileSync('docs/PREMIUM_MAP_SPATIAL_ANALYSIS.json','utf8'));
          const c = analysis.completeness;
          if (c.outletCount !== 10 || c.withCapturedJson !== 8 || c.withFeatureCollections !== 8 || c.withAnchoredLocations !== 8 || c.withPdfEvidence !== 2) {
            throw new Error(`Unexpected evidence coverage: ${JSON.stringify(c)}`);
          }
          NODE

      - name: Reject leaked credentials
        run: node tools/checkAuthorizedPremiumMapEvidenceSafety.mjs

      - name: Commit sanitized evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PREMIUM_MAP_NETWORK_DISCOVERY.json docs/PREMIUM_MAP_SPATIAL_ANALYSIS.json docs/premium-map-network-discovery docs/premium-map-pdf-evidence
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "Capture authorized exact premium map evidence"
          git push origin HEAD:${{ github.ref_name }}
