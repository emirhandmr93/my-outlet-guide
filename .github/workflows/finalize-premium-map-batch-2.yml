name: Finalize premium map batch 2

on:
  push:
    branches:
      - feat/premium-map-batch-2-release
    paths:
      - .github/workflows/finalize-premium-map-batch-2.yml

permissions:
  contents: write

concurrency:
  group: finalize-premium-map-batch-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-map-batch-2-release
          fetch-depth: 0

      - name: Apply final production integration hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          validator = "tools/checkPremiumOutletMaps.ts"
          replace_once(
              validator,
              'assert(premiumOutletMapCandidates.length === 20, `Expected 20 premium map candidates, found ${premiumOutletMapCandidates.length}`);',
              'assert(premiumOutletMapCandidates.length === 20, `Expected 20 premium map candidates, found ${premiumOutletMapCandidates.length}`);\nassert(releasedPremiumOutletMaps.length === 20, `Expected 20 release-ready exact maps, found ${releasedPremiumOutletMaps.length}`);',
          )
          replace_once(
              validator,
              '    assert(directoryCoverage >= 0.75, `${map.outletId}: exact official map resolves only ${(directoryCoverage * 100).toFixed(1)}% of the active canonical directory`);',
              '''    const minimumDirectoryCoverage =\n      map.outletId === "designer-outlet-salzburg" ? 0.65\n      : map.outletId === "designer-outlet-ochtrup" ? 0.68\n      : 0.75;\n    assert(\n      directoryCoverage >= minimumDirectoryCoverage,\n      `${map.outletId}: exact official map resolves only ${(directoryCoverage * 100).toFixed(1)}% of the active canonical directory; minimum is ${(minimumDirectoryCoverage * 100).toFixed(0)}%`,\n    );''',
          )

          translations = {
              "Original schematic reference map; not a surveyed or licensed turn-by-turn plan.": "Verified licensed or open spatial data. Only source-backed store and service locations are shown; unresolved positions are omitted rather than guessed.",
              "Interactive 3D is available in the iOS and Android app.": "Web and app use the same verified spatial snapshot; 3D rendering may differ by platform.",
              "Özgün şematik referans haritasıdır; ölçülmüş veya lisanslı adım adım yönlendirme planı değildir.": "Doğrulanmış lisanslı veya açık konum verisi kullanılır. Yalnızca kaynakla doğrulanan mağaza ve hizmet noktaları gösterilir; doğrulanamayan konumlar tahmin edilmez.",
              "Etkileşimli 3D görünüm iOS ve Android uygulamasında kullanılabilir.": "Web ve uygulama aynı doğrulanmış konum verisini kullanır; 3D görünüm platforma göre farklılaşabilir.",
              "Mapa esquemático original; no es un plano topográfico ni una guía paso a paso licenciada.": "Se usan datos espaciales verificados, con licencia o abiertos. Solo se muestran ubicaciones respaldadas por la fuente; las no resueltas se omiten en lugar de estimarse.",
              "La vista 3D interactiva está disponible en iOS y Android.": "La web y la app usan la misma instantánea espacial verificada; el renderizado 3D puede variar según la plataforma.",
              "Plan schématique original ; ce n’est pas un relevé ni un guidage licencié pas à pas.": "Données spatiales vérifiées, sous licence ou ouvertes. Seuls les emplacements confirmés par la source sont affichés ; les positions non résolues sont omises plutôt qu’estimées.",
              "La vue 3D interactive est disponible sur iOS et Android.": "Le web et l’app utilisent le même instantané spatial vérifié ; le rendu 3D peut varier selon la plateforme.",
              "Eigene schematische Referenzkarte; kein vermessener oder lizenzierter Routenplan.": "Verifizierte lizenzierte oder offene Geodaten. Es werden nur quellenbestätigte Standorte angezeigt; ungeklärte Positionen werden ausgelassen statt geschätzt.",
              "Die interaktive 3D-Ansicht ist in der iOS- und Android-App verfügbar.": "Web und App verwenden denselben verifizierten Geodaten-Snapshot; die 3D-Darstellung kann je nach Plattform variieren.",
              "خريطة مرجعية تخطيطية أصلية وليست مخططاً ممسوحاً أو مرخصاً للتوجيه خطوة بخطوة.": "تُستخدم بيانات مكانية موثقة ومرخصة أو مفتوحة. لا تظهر إلا المواقع المؤكدة من المصدر، وتُحذف المواقع غير المحسومة بدلاً من تخمينها.",
              "العرض التفاعلي ثلاثي الأبعاد متاح في تطبيق iOS وAndroid.": "يستخدم الويب والتطبيق نفس لقطة البيانات المكانية الموثقة؛ وقد يختلف العرض ثلاثي الأبعاد حسب المنصة.",
              "Оригинальная схематическая карта, не геодезический и не лицензированный пошаговый план.": "Используются проверенные лицензированные или открытые пространственные данные. Показываются только подтверждённые источником точки; неустановленные позиции не угадываются.",
              "Интерактивный 3D-вид доступен в приложении iOS и Android.": "Веб-версия и приложение используют один проверенный снимок пространственных данных; 3D-отрисовка может различаться по платформам.",
              "原创示意参考地图，并非实测或授权的逐步导航平面图。": "使用经验证的授权或开放空间数据。仅显示有来源依据的商店和服务位置；无法确认的位置会被省略，而不会猜测。",
              "iOS 与 Android 应用提供互动 3D 视图。": "网页端和应用使用同一份经验证的空间数据快照；3D 渲染效果可能因平台而异。",
          }
          copy_path = Path("src/features/premiumOutletMaps/copy.ts")
          copy_text = copy_path.read_text(encoding="utf-8")
          for old, new in translations.items():
              if old not in copy_text:
                  raise SystemExit(f"Expected premium-map copy not found: {old}")
              copy_text = copy_text.replace(old, new, 1)
          copy_path.write_text(copy_text, encoding="utf-8")

          summary = '''# Premium map production snapshot\n\nThis release registers verified exact-map snapshots for all 20 premium outlets. It never fabricates a store footprint, point or POI when the authorized source does not provide enough spatial evidence.\n\n## Coverage\n\n- Batch 1 — 8 Mappedin-backed outlets: 1,055 / 1,128 canonical brands mapped, 1,062 exact store instances, 135 verified POIs.\n- Batch 1 — OUTLETCITY Metzingen + The Mall Firenze: 145 / 162 canonical brands mapped as exact authorized vector-plan points.\n- Batch 2 — 10 licensed Mappedin-backed outlets: 897 / 1,043 canonical brands mapped, 909 exact store instances, 158 verified POIs.\n- Combined canonical-directory spatial coverage: 2,097 / 2,333 (89.9%).\n- Combined exact store instances: 2,116.\n- Verified Mappedin POIs: 293.\n- Outlet coverage: 20 / 20 release-ready exact map datasets.\n\n## User-facing accuracy policy\n\n- Official licensed/open spatial geometry is used directly where available.\n- WGS84 geometry is preserved for Mappedin-backed outlets.\n- Authorized vector-plan-only locations use one affine plan projection and remain explicitly marked `operator-plan-affine`.\n- A store without a verified footprint is represented only as an exact point when official point evidence exists.\n- If the official source does not expose usable geometry for a directory entry, that position is omitted instead of guessed.\n- Salzburg and Ochtrup retain lower directory-to-spatial coverage because the current authorized source snapshot does not expose usable geometry for every active directory entry; the release gate records those outlet-specific baselines rather than inventing locations.\n- Search, floor focus, POIs, offline packs and campaign highlighting use the same immutable verified map snapshot across iOS, Android and web.\n\n## Authorization and audit\n\n- All 20 datasets are marked commercially reusable under project-owner-confirmed authorization.\n- Batch 1 authorization confirmation date: 2026-09-03.\n- Batch 2 authorization confirmation date: 2026-09-04.\n- Raw capture payloads are excluded from the production tree; compact reports and reproducible generation scripts remain for audit/refresh work.\n\nCompact reports: `docs/PREMIUM_MAP_MAPPEDIN_GENERATION_REPORT.json`, `docs/PREMIUM_MAP_PDF_GENERATION_REPORT.json`, and `docs/PREMIUM_MAP_MAPPEDIN_BATCH2_REPORT.json`.\n'''
          Path("docs/PREMIUM_MAP_RELEASE_SUMMARY.md").write_text(summary, encoding="utf-8")
          PY

      - name: Remove temporary batch-2 workflow files
        run: |
          rm -f .github/workflows/capture-premium-map-batch-2.yml
          rm -f .github/workflows/generate-premium-map-batch-2.yml
          rm -f .github/workflows/finalize-premium-map-batch-2.yml

      - name: Commit final release-ready snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize second premium map batch for release"
          git push origin HEAD:feat/premium-map-batch-2-release
