name: Sync complete final expansion directories

on:
  push:
    branches:
      - fix/complete-final-expansion-store-directories

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-final-expansion-store-directories
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:sync
      - run: npm run data:check
      - run: npm run validate:master-data
      - run: node --import tsx tools/checkFinalExpansionStoreDirectories.ts
      - name: Commit synchronized MasterData
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MasterData
          if git diff --cached --quiet; then
            echo "MasterData already synchronized."
          else
            git commit -m "data: synchronize complete final expansion directories"
            git push origin HEAD:fix/complete-final-expansion-store-directories
          fi
